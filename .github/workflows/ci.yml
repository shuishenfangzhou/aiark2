name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Data audit
        run: npm run data:audit

      - name: Build
        run: npm run build

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - name: Start server and run Lighthouse
        run: |
          npx serve -s dist -l 3000 &
          SERVER_PID=$!
          sleep 3
          echo "Server started (PID: $SERVER_PID)"
          mkdir -p lhci-reports
          xvfb-run --auto-servernum npx lhci collect --url=http://localhost:3000 --url=http://localhost:3000/learn --url=http://localhost:3000/tasks/write-paper --settings.chromeFlags="--no-sandbox --headless=new --disable-gpu" --settings.formFactor=desktop --settings.screenEmulation.mobile=false --settings.screenEmulation.width=1440 --settings.screenEmulation.height=900 --numberOfRuns=1 2>&1
          echo "Collect exit code: $?"
        continue-on-error: true

      - name: Upload LHCI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30
